[project]
name = "camtcr"
version = "0.1.0"
description = "CA-MTCR (change-aware multi-temporal cloud removal), re-implemented from the paper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",  # VGG16 for the perceptual and style loss
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# N (pep8-naming) is off: tensor-dim names (B, T, H, W) are the convention here.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
